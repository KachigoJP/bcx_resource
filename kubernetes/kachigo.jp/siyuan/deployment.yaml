apiVersion: apps/v1
kind: Deployment
metadata:
  name: siyuan
  namespace: default
  labels:
    app: siyuan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siyuan
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: siyuan
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: siyuan
        image: b3log/siyuan:latest
        imagePullPolicy: Always
        args:
        - serve
        - --workspace=/siyuan/workspace
        ports:
        - name: http
          containerPort: 6806
          protocol: TCP
        envFrom:
        - configMapRef:
            name: siyuan-config
        - secretRef:
            name: siyuan-secret
        volumeMounts:
        - name: siyuan-data
          mountPath: /siyuan/workspace
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 120
          timeoutSeconds: 5
          periodSeconds: 20
          failureThreshold: 6
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
      volumes:
      - name: siyuan-data
        persistentVolumeClaim:
          claimName: siyuan-data

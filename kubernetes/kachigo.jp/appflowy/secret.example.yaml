apiVersion: v1
kind: Secret
metadata:
  name: appflowy-secret
  namespace: default
type: Opaque
stringData:
  APPFLOWY_DATABASE_URL: postgres://appflowy:replace-with-password@postgres:5432/appflowy?sslmode=disable
  APPFLOWY_WORKER_DATABASE_URL: postgres://appflowy:replace-with-password@postgres:5432/appflowy?sslmode=disable
  APPFLOWY_SEARCH_DATABASE_URL: postgres://appflowy:replace-with-password@postgres:5432/appflowy?sslmode=disable
  GOTRUE_JWT_SECRET: replace-with-random-64-character-secret
  APPFLOWY_S3_ACCESS_KEY: replace-with-aws-access-key-id
  APPFLOWY_S3_SECRET_KEY: replace-with-aws-secret-access-key
  APPFLOWY_MAILER_SMTP_HOST: smtp.example.com
  APPFLOWY_MAILER_SMTP_PORT: "587"
  APPFLOWY_MAILER_SMTP_USERNAME: noreply@example.com
  APPFLOWY_MAILER_SMTP_EMAIL: noreply@example.com
  APPFLOWY_MAILER_SMTP_PASSWORD: replace-with-smtp-password
  AI_OPENAI_API_KEY: ""
  AZURE_OPENAI_API_KEY: ""
  AZURE_OPENAI_ENDPOINT: ""
  AZURE_OPENAI_API_VERSION: ""

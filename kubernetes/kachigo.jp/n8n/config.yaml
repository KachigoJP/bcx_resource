apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-config
  namespace: default
data:
  GENERIC_TIMEZONE: Asia/Tokyo
  TZ: Asia/Tokyo
  N8N_HOST: '0.0.0.0'
  N8N_PORT: "5678"
  N8N_PROTOCOL: https
  N8N_EDITOR_BASE_URL: https://n8n.kachigo.jp
  WEBHOOK_URL: https://n8n.kachigo.jp
  N8N_SECURE_COOKIE: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "336"
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: "ep-delicate-frost-ajuljjor-pooler.c-3.us-east-2.aws.neon.tech"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: "n8n"
  DB_POSTGRESDB_USER: "neondb_owner"
  DB_POSTGRESDB_SSL_ENABLED: "true"
  PGSSLMODE: "require"
  PGCHANNELBINDING: "require"

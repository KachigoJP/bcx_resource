apiVersion: v1
kind: Secret
metadata:
  name: gotrue-secret
  namespace: default
type: Opaque
stringData:
  GOTRUE_DATABASE_URL: postgres://appflowy:replace-with-password@postgres:5432/appflowy?sslmode=disable
  GOTRUE_ADMIN_EMAIL: admin@example.com
  GOTRUE_ADMIN_PASSWORD: replace-with-admin-password
  GOTRUE_JWT_SECRET: replace-with-random-64-character-secret
  GOTRUE_SMTP_HOST: smtp.example.com
  GOTRUE_SMTP_PORT: "587"
  GOTRUE_SMTP_USER: noreply@example.com
  GOTRUE_SMTP_PASS: replace-with-smtp-password
  GOTRUE_SMTP_ADMIN_EMAIL: admin@example.com

apiVersion: apps/v1
kind: Deployment
metadata:
  name: browserless
  namespace: default
  labels:
    app: browserless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: browserless
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: browserless
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: browserless
        # Official open-source Browserless Chromium image.
        # Pin this to a tested v2 release before using it in production.
        image: ghcr.io/browserless/chromium:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: browserless-config
        env:
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: browserless-secret
              key: token
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 3Gi
        volumeMounts:
        - name: shared-memory
          mountPath: /dev/shm
      volumes:
      - name: shared-memory
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi

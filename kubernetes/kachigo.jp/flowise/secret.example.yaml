apiVersion: v1
kind: Secret
metadata:
  name: flowise-secret
  namespace: default
type: Opaque
data:
  DATABASE_PASSWORD: "replace-with-postgres-password"
  S3_STORAGE_ACCESS_KEY_ID: "replace-with-b2-key-id"
  S3_STORAGE_SECRET_ACCESS_KEY: "replace-with-b2-application-key"
  FLOWISE_SECRETKEY_OVERWRITE: "replace-with-strong-encryption-key"
  JWT_AUTH_TOKEN_SECRET: "replace-with-openssl-rand-hex-32"
  JWT_REFRESH_TOKEN_SECRET: "replace-with-openssl-rand-hex-32"
  EXPRESS_SESSION_SECRET: "replace-with-openssl-rand-hex-32"
  TOKEN_HASH_SECRET: "replace-with-openssl-rand-hex-32"

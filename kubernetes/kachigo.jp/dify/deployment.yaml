apiVersion: apps/v1
kind: Deployment
metadata:
  name: dify-ssrf-proxy
  namespace: default
  labels:
    app: dify-ssrf-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dify-ssrf-proxy
  template:
    metadata:
      labels:
        app: dify-ssrf-proxy
    spec:
      containers:
      - name: ssrf-proxy
        image: ubuntu/squid:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3128
          protocol: TCP
        volumeMounts:
        - name: squid-config
          mountPath: /etc/squid/squid.conf
          subPath: squid.conf
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: squid-config
        configMap:
          name: dify-ssrf-proxy-config

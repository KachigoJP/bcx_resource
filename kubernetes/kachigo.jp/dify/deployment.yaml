apiVersion: apps/v1
kind: Deployment
metadata:
  name: dify-web
  namespace: default
  labels:
    app: dify-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dify-web
  template:
    metadata:
      labels:
        app: dify-web
    spec:
      containers:
      - name: dify-web
        image: langgenius/dify-web:1.16.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: dify-config
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 120
          timeoutSeconds: 5
          periodSeconds: 20
          failureThreshold: 6
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dify-redis
  namespace: default
  labels:
    app: dify-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dify-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: dify-redis
    spec:
      containers:
      - name: redis
        image: redis:6-alpine
        imagePullPolicy: Always
        command:
        - sh
        - -c
        - redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        envFrom:
        - secretRef:
            name: dify-secret
        volumeMounts:
        - name: dify-redis-data
          mountPath: /data
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" ping
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: dify-redis-data
        persistentVolumeClaim:
          claimName: dify-redis-data
---

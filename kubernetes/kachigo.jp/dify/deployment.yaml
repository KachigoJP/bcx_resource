apiVersion: apps/v1
kind: Deployment
metadata:
  name: dify-api
  namespace: default
  labels:
    app: dify-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dify-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: dify-api
    spec:
      containers:
      - name: dify-api
        image: langgenius/dify-api:1.16.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 5001
          protocol: TCP
        envFrom:
        - configMapRef:
            name: dify-config
        - secretRef:
            name: dify-secret
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dify-secret
              key: REDIS_PASSWORD
        - name: CELERY_BROKER_URL
          value: redis://:$(REDIS_PASSWORD)@dify-redis-service:6379/1
        - name: MODE
          value: api
        volumeMounts:
        - name: dify-storage
          mountPath: /app/api/storage
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 120
          timeoutSeconds: 5
          periodSeconds: 20
          failureThreshold: 6
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
      volumes:
      - name: dify-storage
        persistentVolumeClaim:
          claimName: dify-storage
---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kachigo-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - n8n.kachigo.jp
    - flowise.kachigo.jp
    secretName: kachigo-tls-secret
  rules:
  - host: n8n.kachigo.jp
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: n8n-service
            port:
              number: 80
  - host: flowise.kachigo.jp
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flowise-service
            port:
              number: 80

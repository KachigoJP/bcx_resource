apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- config.yaml
- secret.yaml
- deployment.yaml
- service.yaml

secretGenerator:
- name: affine-secret
  namespace: default
  behavior: merge
  files:
  - config.json=credential.json

generatorOptions:
  disableNameSuffixHash: true

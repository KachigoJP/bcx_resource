apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-config
  namespace: default
data:
  TZ: Asia/Tokyo
  PORT: "8080"
  WEBUI_NAME: Open WebUI
  WEBUI_URL: https://open-webui.kachigo.jp
  ENV: prod
  ENABLE_SIGNUP: "false"
  DEFAULT_USER_ROLE: pending
  ENABLE_PERSISTENT_CONFIG: "true"
  ENABLE_VERSION_UPDATE_CHECK: "false"
  DO_NOT_TRACK: "true"
  DATABASE_ENABLE_SESSION_SHARING: "true"
  DB_HOST: cloudsql-proxy
  DB_PORT: "5432"
  DB_DATABASE: open-webui
  DB_USERNAME: open-webui-user
  DB_SSL_MODE: disable
  STORAGE_PROVIDER: s3
  STORAGE_LOCAL_CACHE: "false"
  S3_BUCKET_NAME: kachigo-open-webui
  S3_REGION_NAME: us-east-005
  S3_ENDPOINT_URL: https://s3.us-east-005.backblazeb2.com
  S3_ADDRESSING_STYLE: path
  S3_ENABLE_TAGGING: "false"

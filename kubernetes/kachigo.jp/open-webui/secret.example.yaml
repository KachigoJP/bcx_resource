apiVersion: v1
kind: Secret
metadata:
  name: open-webui-secret
  namespace: default
type: Opaque
stringData:
  WEBUI_SECRET_KEY: "replace-with-strong-secret-key"
  DB_PASSWORD: "replace-with-postgres-password"
  S3_ACCESS_KEY_ID: "replace-with-b2-key-id"
  S3_SECRET_ACCESS_KEY: "replace-with-b2-application-key"

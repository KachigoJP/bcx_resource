/auth/realms/{realm}/protocol/openid-connect/token:
  post:
    summary: Obtain an access token
    description: Routes token requests to Keycloak.
    operationId: getAccessToken
    responses:
      '200':
        description: Successful response
      '401':
        description: Unauthorized
    requestBody:
      description: Token request payload
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              client_id:
                type: string
              client_secret:
                type: string
              grant_type:
                type: string
              username:
                type: string
              password:
                type: string
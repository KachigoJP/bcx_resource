apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms-backend
  labels:
    app: cms-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cms-backend
  template:
    metadata:
      labels:
        app: cms-backend
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: private-node-pool
      containers:
      - name: cms-backend
        image: your-backend-image:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cms-backend-service
  labels:
    app: cms-backend
  annotations:
    cloud.google.com/load-balancer-type: "Internal" # Internal load balancer
spec:
  type: LoadBalancer
  selector:
    app: cms-backend
  ports:
  - port: 80
    targetPort: 8080
